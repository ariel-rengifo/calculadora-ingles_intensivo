<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libreta de notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="pizarra">
  <h1 class="titulo">Libreta de notas</h1>
  <p class="subtitulo">Completa cada casilla para calcular tu promedio</p>

  <form id="form-notas" class="libreta">
    <div class="fila">
      <label for="oral1">Oral 1</label>
      <input type="number" id="oral1" name="oral1" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="oral2">Oral 2</label>
      <input type="number" id="oral2" name="oral2" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="pb">Progress Booklet</label>
      <input type="number" id="pb" name="pb" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="cbg">Cambridge One</label>
      <input type="number" id="cbg" name="cbg" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="st">Speaking Task</label>
      <input type="number" id="st" name="st" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="unt3">Unit Test 3</label>
      <input type="number" id="unt3" name="unt3" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="unt4">Unit Test 4</label>
      <input type="number" id="unt4" name="unt4" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="ctest1">Competency Test 1</label>
      <input type="number" id="ctest1" name="ctest1" min="0" max="100" required>
    </div>
    <div class="fila">
      <label for="ctest2">Competency Test 2</label>
      <input type="number" id="ctest2" name="ctest2" min="0" max="100" required>
    </div>

    <button type="submit" class="boton-calcular">Calcular promedio</button>
  </form>

  <p id="mensaje-error" class="error oculto"></p>

  <div id="resultado" class="resultado oculto">
    <div class="linea-resultado">
      <span>Progress Booklet + Cambridge One + Speaking Task</span>
      <strong id="promo1"></strong>
    </div>
    <div class="linea-resultado">
      <span>Unit Test 3 + Unit Test 4 + Competency Test 1 + 2</span>
      <strong id="promo2"></strong>
    </div>
    <div class="linea-resultado total">
      <span>Promedio total</span>
      <strong id="promtotal"></strong>
    </div>

    <div id="animacion" class="animacion oculto">
      <svg id="svg-check" class="svg-check oculto" viewBox="0 0 100 100">
        <circle class="circulo" cx="50" cy="50" r="45"/>
        <path class="check" d="M27 52 L43 68 L75 32"/>
      </svg>
      <div id="lapiz-animo" class="lapiz-animo oculto">
        <span class="linea-subrayado"></span>
      </div>
      <p id="mensaje-final" class="mensaje-final"></p>
    </div>
  </div>
</div>

<div id="particulas" class="particulas"></div>

<script src="static/script.js"></script>
</body>
</html>
